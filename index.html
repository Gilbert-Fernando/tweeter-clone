<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tweeter Clone</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <script defer src="script.js"></script>
</head>
<body>
  <!-- Top Navigation -->
  <nav class="top-nav">
    <img src="image/logo.png" alt="Tweeter Logo" class="logo">
    <h1>Tweeter</h1>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <section class="tweet-box">
      <div class="profile-pic"></div>
      <div class="tweet-input">
        <textarea id="tweetText" placeholder="What's happening?" maxlength="160"></textarea>
        <div class="tweet-footer">
          <span id="charCount">160 characters remaining</span>
          <button id="tweetBtn">Tweeet</button>
        </div>
      </div>
    </section>

    <!-- Sample posted tweet -->
    <section class="posted-tweet">
      <div class="profile-pic"></div>
      <div class="tweet-content">
        <div class="tweet-header">
          <span class="name">Gilberto Garza</span>
          <span class="username">@jucateco_tactico89</span>
          <span class="date">· Feb 20</span>
        </div>
        <p>"controversial political opinion", from CSCI 3342.</p>
        <div class="tweet-icons">
          <div class="tweet-icons">
          <i class="far fa-comment"></i>   <!-- comment -->
          <i class="fas fa-retweet"></i>   <!-- retweet -->
          <i class="fas fa-link"></i>      <!-- link -->
          <i class="fas fa-upload"></i>    <!-- upload -->
        </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
